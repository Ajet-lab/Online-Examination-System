<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Examination Page</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- =========================================
         EXAM CONTAINER
    ========================================= -->

    <div class="exam-container">


        <!-- =========================================
             EXAM HEADER
        ========================================= -->

        <header class="exam-header">

            <h1 id="examTitle">
                Examination
            </h1>

            <p class="student-name" id="studentName">
                Student: Loading...
            </p>

        </header>


        <!-- =========================================
             EXAM BODY
        ========================================= -->

        <main class="exam-body">


            <!-- =========================================
                 QUESTION COUNTER
            ========================================= -->

            <div class="question-counter">

                <p>
                    Question 1 of 1
                </p>

            </div>


            <!-- =========================================
                 QUESTION
            ========================================= -->

            <section class="question-block">

                <p class="question-text">
                    Loading question...
                </p>


                <!-- =========================================
                     ANSWER OPTIONS
                ========================================= -->

                <form class="options">

                </form>

            </section>


            <!-- =========================================
                 PREVIOUS / NEXT BUTTONS
            ========================================= -->

            <div class="exam-navigation">

                <button
                    type="button"
                    class="btn-prev"
                >
                    Previous
                </button>

                <button
                    type="button"
                    class="btn-next"
                >
                    Next
                </button>

            </div>


            <!-- =========================================
                 QUESTION NAVIGATOR
            ========================================= -->

            <nav class="question-navigator">

            </nav>


            <!-- =========================================
                 SUBMIT EXAM
            ========================================= -->

            <div class="submit-wrapper">

                <button
                    type="button"
                    class="btn-submit"
                >
                    Submit Exam
                </button>

            </div>

        </main>


        <!-- =========================================
             TIMER
        ========================================= -->

        <footer class="exam-timer-footer">

            <div class="timer">

                <span class="timer-label">
                    Time Remaining
                </span>

                <span class="timer-value">
                    00:00
                </span>

            </div>

        </footer>

    </div>


    <!-- =========================================
         LOAD STUDENT INFORMATION
    ========================================= -->

    <script>

        // =========================================
        // CHECK LOGIN
        // =========================================

        const token =
            localStorage.getItem('token');

        if (!token) {

            window.location.href =
                'login.html';

        }


        // =========================================
        // DISPLAY STUDENT NAME
        // =========================================

        const savedUser =
            localStorage.getItem('user');

        if (savedUser) {

            try {

                const user =
                    JSON.parse(savedUser);

                if (
                    user &&
                    user.role === 'student'
                ) {

                    document
                        .getElementById('studentName')
                        .textContent =
                        `Student: ${user.name}`;

                }

            } catch (error) {

                console.error(
                    'Unable to read student information:',
                    error
                );

            }

        }

    </script>


    <!-- =========================================
         EXAM JAVASCRIPT
    ========================================= -->

    <script src="questions.js"></script>

</body>

</html>
